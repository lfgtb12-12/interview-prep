<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Engineering Handbook · v0.1</title><link rel="stylesheet" href="./navigation.css">
<style>:root{color-scheme:dark;--bg:#0e1927;--panel:#19293a;--line:#3b5166;--ink:#f4f7f9;--muted:#bfd0df;--accent:#86e4cd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif}a{color:var(--accent)}header{padding:24px 5%;border-bottom:1px solid var(--line)}header a{margin-right:20px}.layout{max-width:1200px;margin:auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:25px;padding:25px}aside{position:sticky;top:10px;align-self:start}aside button{display:block;width:100%;text-align:left;margin:8px 0}.panel,section{background:var(--panel);padding:24px;border:1px solid var(--line);border-radius:18px;margin:0 0 20px}h1{font-size:clamp(29px,4vw,48px);line-height:1.15}h2{font-size:24px}h3{font-size:19px}p{max-width:75ch}.muted{color:var(--muted)}button,.btn{background:#275a65;border:1px solid #5799a2;color:white;border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit;margin:4px 4px 4px 0}button:hover{background:#327381}button:focus-visible,a:focus-visible{outline:3px solid var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.tile{border:1px solid var(--line);border-radius:12px;padding:15px;background:#203449}.pill{font-size:12px;border:1px solid var(--line);padding:3px 8px;border-radius:12px}.active{background:#367b71}pre{padding:18px;border-radius:12px;background:#08101a;overflow:auto;line-height:1.4}code{font:14px ui-monospace,monospace}.hidden{display:none}.answer{background:#263f44;border-radius:10px;padding:12px;margin-top:10px}.track{display:inline-block;background:#243e50;border:1px solid var(--line);padding:7px 12px;border-radius:24px;margin:4px}progress{width:100%;height:14px}label{display:block;margin:10px 0}textarea{width:100%;min-height:100px;background:#0d1d2d;color:white;border:1px solid var(--line);padding:12px;border-radius:9px}small{color:var(--muted)}@media(max-width:730px){.layout{display:block;padding:14px}aside{position:static}section,.panel{padding:17px}header{padding:16px}}</style>
<header><b>AI ENGINEERING HANDBOOK</b> <span class="pill">v0.1</span> <p><a href="../">← Interview Prep homepage</a> <a href="../flashcards.html">DSA flashcards</a> <a href="../Illustrated_Interview_Notebook.html">Interview notebook</a></p></header>
<div class="layout"><aside class="panel"><strong>Progress & backup</strong><p><small>Use the curriculum navigation above to switch lessons and activities.</small></p><hr><p><small>Progress is stored in this browser only. Export and import to move devices.</small></p><button onclick="exportProgress()">Export progress</button><label class="btn" for="import">Import progress<input id="import" style="display:none" type="file" accept=".json,application/json"></label><progress id="progress" max="1" value="0"></progress><p id="progressLabel"></p></aside><main id="main"></main></div>
<script>
const mods=["LLM Engineering Foundations","Python for AI Engineering","AI Agents & Tool Calling","RAG & Information Retrieval","Evaluation & Experimentation","State, Memory & Durable Execution","Security, Integrations & Protocols","AI Platform & Operations","ML Fundamentals & Model Adaptation","Advanced Agent Architecture","AI System Design","Portfolio & Interview Execution"];
const questions=[["Which component authorizes a tool call?",["The LLM","Application controller","Retrieved document"],1,"Only trusted application code should enforce authorization and policy."],["What defines an agent rather than a fixed workflow?",["Model can choose next actions using feedback","Uses a transformer model","Has three microservices"],0,"Agentic autonomy concerns who chooses the next action, not which model is used."],["A send_email tool times out. What should happen?",["Retry immediately","Assume failure","Reconcile or deduplicate with original operation key"],2,"Unknown external effects must be reconciled; a timeout does not prove failure."],["What prevents unlimited agent iteration?",["Longer context","Step and deadline budgets","Higher temperature"],1,"Bound work with tool limits, deadlines, cost budgets and no-progress detection."],["Tool output includes instructions to ignore developer rules. Treat it as:",["Trusted instructions","Untrusted data","Administrator override"],1,"Tool results are untrusted input and must not control tool policy."]];
const cards=[["Agent","System where a model chooses actions using feedback under runtime controls."],["Workflow","Developer fixes execution steps; LLMs can appear inside those steps."],["Control boundary","Model proposes, trusted code validates and executes."],["Observation","Structured result/error added to context after tool execution."],["Ambiguous outcome","A timeout may follow successful external execution; reconcile before repeating."],["Stop criteria","Steps, deadline, tokens, cost, no-progress, safety and final answer."]];
const steps=["Controller gives model context and permitted tool schemas.","Model returns a final answer or proposes a structured tool call.","Controller checks tool allowlist, schema, authorization and budget.","Trusted tool adapter executes; result or error becomes an observation.","Controller persists required state and decides whether to continue or stop."];
let state;try{state=JSON.parse(localStorage.getItem("ai-handbook-progress-v1"))||{}}catch{state={}};state={done:false,answers:{},notes:"",...state};let flash=0,flipped=false,step=0;
const $=id=>document.getElementById(id);function safe(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function persist(){localStorage.setItem("ai-handbook-progress-v1",JSON.stringify(state));$("progress").value=(Number(state.done)+Object.keys(state.answers).length/5)/2;$("progressLabel").textContent=(state.done?"Lesson read":"Lesson not marked done")+" · "+Object.keys(state.answers).length+"/5 quiz answered"}
function show(p){location.hash=p;const common='<p class="muted">Applied AI Engineering · mid-level implementation + senior-level architecture</p>';let h='';
if(p==="home"){h='<section><span class="pill">Learn · Build · Interview · Get Hired</span><h1>Your AI Engineering Handbook</h1>'+common+'<p>Study with guided concepts, executable Python, failure analysis, interview prompts and active recall. Begin with AI agents, then follow prerequisites in Python and LLM engineering.</p><button onclick="show(\'lesson\')">Start first lesson →</button><button onclick="show(\'roadmap\')">Browse roadmap</button></section><section><h2>Your path to an offer</h2><div class="grid">'+["Learn concepts deeply","Build 2 credible projects","Practice coding and AI system design","Interview, review, and apply"].map(x=>'<div class="tile">'+x+'</div>').join('')+'</div><p>Prioritize a reliable research agent and a production-quality RAG assistant; capture design decisions, evaluations and tradeoffs.</p></section>';}
else if(p==="roadmap"){h='<section><h1>12-module curriculum</h1>'+common+'<p>Start with M03 while strengthening M01/M02 foundations; practice evals, engineering, system design and interview fluency in parallel.</p><div class="grid">'+mods.map((m,i)=>'<div class="tile"><span class="pill">M'+String(i+1).padStart(2,"0")+'</span><h3>'+m+'</h3><p>'+(i===2?'Lesson M03-L01 available':'Planned: content and assessments to be developed')+'</p>'+(i===2?'<button onclick="show(\'lesson\')">Open lesson</button>':'')+'</div>').join('')+'</div></section>'}
else if(p==="lesson"){h='<section><small>M03-L01 · 45-minute lesson · reviewed 2026-10-22</small><h1>What Is an AI Agent?</h1><p><a class="btn" href="./chapter-agent.html">Open the expanded interactive lesson →</a></p><p class="muted">Includes animated control-flow diagrams, three failure scenarios, guided code and mid/senior interview drills. The shorter reference below remains available.</p>'+common+'<p><strong>An agent is a system, not merely an LLM.</strong> A model can propose which action to perform next based on observations. Application code decides what is allowed, how to execute it, and when to stop.</p><p><strong>Memorize:</strong> Model proposes; code disposes.</p><div class="grid"><div class="tile"><h3>Chatbot</h3>Generates responses; tools are optional.</div><div class="tile"><h3>Fixed workflow</h3>Developer defines step order; may invoke a model.</div><div class="tile"><h3>Agent</h3>Model selects subsequent actions within code-enforced constraints.</div></div><p>Autonomy is a spectrum. Prefer a fixed workflow when the process is predictable; add model choice where it improves measured task outcomes.</p></section><section><h2>Interactive tool execution</h2><p id="stepText">'+steps[0]+'</p><button onclick="step=Math.max(0,step-1);drawStep()">← Previous</button><button onclick="step=Math.min(4,step+1);drawStep()">Next →</button><small id="stepNumber"> 1 of 5</small><div class="grid"><div class="tile">Task + context</div><div class="tile">Model proposal</div><div class="tile">Runtime validation</div><div class="tile">Tool result → observation</div></div></section><section><h2>Python implementation lab</h2><p>This offline example simulates the model while exercising the controller loop. It does not contact a model provider or execute unapproved actions.</p><pre><code>'+safe('def add(a: int, b: int) -> int:\n    return a + b\n\nTOOLS = {"add": add}\n\ndef run_agent(model, limit=5):\n    history = []\n    for _ in range(limit):\n        msg = model(history)\n        if msg["type"] == "final":\n            return msg["text"]\n        name = msg["tool"]\n        if name not in TOOLS:\n            raise ValueError("Unauthorized tool")\n        args = msg["args"]\n        if set(args) != {"a", "b"} or not all(type(v) is int for v in args.values()):\n            raise ValueError("Invalid arguments")\n        value = TOOLS[name](**args)\n        history.append({"tool": name, "result": value})\n    raise TimeoutError("Step budget exhausted")\n\ndef fake_model(history):\n    if not history:\n        return {"type": "tool", "tool": "add", "args": {"a": 2, "b": 3}}\n    return {"type": "final", "text": f"The answer is {history[-1][\'result\']}."}\n\nassert run_agent(fake_model) == "The answer is 5."\nprint(run_agent(fake_model))')+'</code></pre><p>Run with <code>python agent_demo.py</code>. Then implement <code>multiply</code>, reject a fictitious <code>delete_all</code>, and test step-budget exhaustion. This is a teaching scaffold; real tools need stronger schema validation, auth, typed results, tracing and deadlines.</p></section><section><h2>Failure modes & engineering tradeoffs</h2><p><b>Unknown tool:</b> reject with allowlist and validated arguments. <b>Looping:</b> step, time and cost limits. <b>Timeout on side effect:</b> treat as UNKNOWN; use stable idempotency key where guaranteed, otherwise query external state or escalate. <b>Prompt injection:</b> tool output is data, never higher-priority instruction. <b>Operational design:</b> preserve checkpoints, audit events and safe retries.</p></section><section><h2>Interview drills</h2><h3>Mid-level</h3><p>Write a typed and bounded tool-calling loop with negative tests for unknown tools, invalid arguments and max rounds. Explain tool-message formatting.</p><h3>Senior-level</h3><p>Design a 10-minute distributed research agent: durable task state, concurrency limits, checkpoints, observability, partial results, cost caps and approval gates. Explain which steps should be deterministic.</p><p><strong>Follow-up:</strong> An email API times out and another worker takes the lease. How do you avoid duplicate sends? Distinguish worker ownership from external side-effect completion, reuse deduplication where supported, reconcile ambiguous outcomes, and never blindly replay.</p><details><summary>60-second model answer</summary><p>An agent is a controlled application whose model can choose next actions from observations. The model proposes structured tool calls; trusted runtime code enforces schema, authorization, ordering, budget and stop conditions. Tool results feed subsequent decisions. I prefer fixed workflows for predictable processes and use model-driven choice where evaluations show a benefit.</p></details><label><b>Reflection notes</b><textarea id="notes" oninput="state.notes=this.value;persist()">'+safe(state.notes)+'</textarea></label><button onclick="state.done=!state.done;persist();show(\'lesson\')">'+(state.done?'✓ Mark incomplete':'Mark lesson complete')+'</button><button onclick="show(\'quiz\')">Quiz & review →</button></section>';}
else if(p==="quiz"){h='<section><h1>Practice Studio</h1><p>Five questions with immediate explanations. Your answers stay in this browser.</p>'+questions.map((q,i)=>'<div class="tile"><h3>'+(i+1)+'. '+q[0]+'</h3>'+q[1].map((a,j)=>'<label><input type="radio" name="q'+i+'" '+(state.answers[i]===j?'checked':'')+' onchange="state.answers['+i+']='+j+';persist();show(\'quiz\')"> '+safe(a)+'</label>').join('')+(state.answers[i]!==undefined?'<p class="answer">'+(state.answers[i]===q[2]?'✓ Correct. ':'Not quite. ')+q[3]+'</p>':'')+'</div>').join('')+'<p><strong>Score: '+questions.filter((q,i)=>state.answers[i]===q[2]).length+'/5</strong></p><button onclick="state.answers={};persist();show(\'quiz\')">Reset quiz</button><button onclick="show(\'cards\')">Flashcards →</button></section>';}
else if(p==="cards"){h='<section><h1>Flashcards</h1><p>Recall the answer aloud before revealing it. Return tomorrow, then at +3 and +7 days.</p><div class="tile"><small>Card '+(flash+1)+' / '+cards.length+'</small><h2>'+safe(cards[flash][0])+'</h2><p>'+(flipped?safe(cards[flash][1]):'What does this term mean?')+'</p><button onclick="flipped=!flipped;show(\'cards\')">'+(flipped?'Hide answer':'Reveal answer')+'</button></div><button onclick="flash=(flash+cards.length-1)%cards.length;flipped=false;show(\'cards\')">← Previous</button><button onclick="flash=(flash+1)%cards.length;flipped=false;show(\'cards\')">Next →</button></section>';}
$("main").innerHTML=h;persist();window.scrollTo(0,0)}
function drawStep(){$("stepText").textContent=steps[step];$("stepNumber").textContent=" "+(step+1)+" of 5"}
function exportProgress(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({format:"ai-handbook-progress-v1",...state},null,2)],{type:"application/json"}));a.download="ai-handbook-progress.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$("import").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const p=JSON.parse(await f.text());if(p.format!=="ai-handbook-progress-v1"||typeof p.answers!=="object"||typeof p.done!=="boolean")throw Error();state={done:p.done,answers:p.answers,notes:typeof p.notes==="string"?p.notes:""};persist();show("home");alert("Progress imported")}catch{alert("Invalid progress format. Existing data unchanged.")}e.target.value=""});show(["home","lesson","roadmap","quiz","cards"].includes(location.hash.slice(1))?location.hash.slice(1):"home");
</script><script src="./navigation.js" defer></script></html>
