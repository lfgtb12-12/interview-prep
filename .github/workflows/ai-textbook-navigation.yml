name: Navigation regression checks
on:
  pull_request:
    paths:
      - 'ai-engineering/navigation.js'
      - 'ai-engineering/curriculum.json'
      - 'ai-engineering/factory/test_navigation.mjs'
      - '.github/workflows/ai-textbook-navigation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run manifest and navigation tests
        run: node --test ai-engineering/factory/test_navigation.mjs
