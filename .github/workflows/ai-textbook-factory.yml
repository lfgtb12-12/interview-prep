name: Factory checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline unit tests
        run: |
          python -m unittest discover -s ai-engineering/factory -p 'test_*.py' -v
          python -m unittest ai-engineering/test_m04_grounding_lab.py -v
          python -m unittest ai-engineering/test_m05_eval_foundations_lab.py -v
      - name: Validate example and render staging preview
        run: |
          python ai-engineering/factory/validate.py ai-engineering/factory/examples/M03-L05.json
          python ai-engineering/factory/render.py ai-engineering/factory/examples/M03-L05.json --out /tmp/textbook-staging
          test -s /tmp/textbook-staging/m03-l05.html
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Exercise interactive widgets in Chromium
        run: |
          python -m unittest discover -s ai-engineering/factory -p 'browser_tests.py' -v
          python -m unittest ai-engineering/test_m05_browser.py -v
